[project]
name = "pdf-crop"
version = "0.1.0"
description = "CLI + TUI to extract page ranges from PDFs"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "textual>=0.80",
]

[project.scripts]
pdfcrop = "pdf_crop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_crop"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
