[project]
name = "pdf-crop"
dynamic = ["version"]
description = "CLI + TUI to extract page ranges from PDFs"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.2.0",
    "pymupdf>=1.27.2.3",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pyzbar>=0.1.9",
    "textual>=0.80",
    "textual-image>=0.8",
]

[project.scripts]
pdfcrop = "pdf_crop.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
tag-pattern = "pdf_crop-v(?P<version>.+)"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
# The package lives in a subdir of the monorepo, so the git root is one level
# up; setuptools-scm doesn't search parents by default.
root = ".."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "pdf_crop-v*"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_crop"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "reportlab>=4.0",
    "segno>=1.6.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # PyMuPDF's SWIG bindings emit these at import on Python 3.12; not our code.
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
