[project]
name = "pxe-boot"
version = "0.1.0"
description = "macOS CLI to PXE-boot a PC on the LAN (netboot.xyz or local ISO)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pxe-boot = "pxe_boot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pxe_boot"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
